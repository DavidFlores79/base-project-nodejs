<div class="flex h-screen overflow-hidden bg-whatsapp-gray">
  <!-- Desktop Navigation Sidebar -->
  <div class="hidden md:flex flex-col bg-whatsapp-dark border-r border-gray-700 w-60 shrink-0">
    <div class="h-16 flex items-center border-b border-gray-700 px-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-lg flex items-center justify-center flex-shrink-0">
          <img src="/media/favicon.png" alt="Logo" class="w-full h-full object-contain">
        </div>
        <div class="flex flex-col">
          <span class="text-gray-100 font-semibold text-sm">Base Project</span>
          <span class="text-gray-400 text-xs">User Portal</span>
        </div>
      </div>
    </div>

    <nav class="flex-1 py-4 px-3 flex flex-col gap-1 overflow-y-auto">
      <button routerLink="/home" routerLinkActive="bg-whatsapp-gray text-whatsapp-green border-l-whatsapp-green"
        class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-gray-200 hover:bg-whatsapp-gray rounded-lg transition-all border-l-4 border-transparent">
        <i class="fas fa-home text-xl"></i>
        <span class="font-medium">Home</span>
      </button>

      <button routerLink="/map" routerLinkActive="bg-whatsapp-gray text-whatsapp-green border-l-whatsapp-green"
        class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:text-gray-200 hover:bg-whatsapp-gray rounded-lg transition-all border-l-4 border-transparent">
        <i class="fas fa-map-marked-alt text-xl"></i>
        <span class="font-medium">Map</span>
      </button>
    </nav>

    <div class="border-t border-gray-700 p-3 flex flex-col gap-1">
      <div class="flex items-center gap-3 px-4 py-3 text-gray-400" *ngIf="currentUser">
        <div class="w-8 h-8 rounded-full overflow-hidden bg-gray-600 flex items-center justify-center flex-shrink-0">
          <img *ngIf="currentUser.avatar" [src]="currentUser.avatar" [alt]="currentUser.username"
            class="w-full h-full object-cover">
          <span *ngIf="!currentUser.avatar" class="text-white text-xs font-medium">
            {{ currentUser.username ? currentUser!.username!.charAt(0).toUpperCase() : '?' }}
          </span>
        </div>
        <div class="flex flex-col items-start min-w-0 flex-1">
          <span class="text-gray-100 text-sm font-medium truncate w-full">{{ currentUser.username }}</span>
          <span class="text-xs text-gray-400 truncate w-full">{{ currentUser.email }}</span>
        </div>
      </div>

      <button (click)="logout()"
        class="w-full px-4 py-3 text-left hover:bg-red-900/30 transition-colors flex items-center gap-3 text-red-400 rounded-lg">
        <i class="fas fa-sign-out-alt w-5"></i>
        <span>Logout</span>
      </button>
    </div>
  </div>

  <!-- Main Content Area -->
  <div class="flex flex-1 flex-col bg-whatsapp-dark relative overflow-hidden">
    <router-outlet></router-outlet>
  </div>
</div>
